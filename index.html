<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d0c"><title>Roohu Football Arena</title></head>
<style>#boot{position:fixed;inset:0;z-index:99;background:radial-gradient(90% 50% at 50% 35%,#0f3d24,#070a09 70%);display:grid;place-items:center;text-align:center;font-family:system-ui,sans-serif;color:#f1f6f3;transition:opacity .6s,transform .6s}
#boot.out{opacity:0;transform:scale(1.08);pointer-events:none}#boot .ball{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;border:4px solid #19e36b;border-top-color:transparent;animation:sp 1s linear infinite;position:relative}
#boot .ball:after{content:"R";position:absolute;inset:0;display:grid;place-items:center;font:italic 700 44px system-ui;color:#19e36b;animation:sp 1s linear infinite reverse}
@keyframes sp{to{transform:rotate(360deg)}}#boot h1{margin:0;font:italic 700 40px system-ui;letter-spacing:.06em;color:#19e36b}#boot p{margin:2px 0 22px;letter-spacing:.45em;font-size:12px;color:#7f8d85}
#boot .bar{width:200px;height:5px;border-radius:9px;background:#ffffff1f;margin:0 auto 10px;overflow:hidden}#boot .bar i{display:block;height:100%;background:#19e36b;animation:ld 2.1s ease-out forwards}@keyframes ld{from{width:0}to{width:100%}}#boot small{color:#7f8d85;font-size:12px}</style>
<div id="boot"><div><div class="ball"></div><h1>ROOHU</h1><p>FOOTBALL ARENA</p><div class="bar"><i></i></div><small id="bt">Loading legends…</small></div></div>
<div id="app"></div><script type="module" src="/src/main.ts"></script></body></html>
